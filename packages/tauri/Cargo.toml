[package]
name = "numas-tauri"
version = "0.0.0"
description = "Numas desktop shell — tray + numas:// scheme around the bundled numas server"
authors = ["numas"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "numas_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
