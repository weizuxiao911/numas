[package]
name = "numas-desktop"
version = "0.1.8"
description = "Numas desktop — Tauri shell wrapping numas CLI + codeblitz web UI"
authors = ["numas"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "numas_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "macros", "rt-multi-thread", "sync", "time"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
